# CRM prod k3s — private IPs via Pangolin

Host crm-cp crm-cp-tyv
  HostName 10.255.0.1
  User root
  IdentityFile ~/.ssh/crm
  IdentitiesOnly yes

Host crm-cp-xup
  HostName 10.255.0.2
  User root
  IdentityFile ~/.ssh/crm
  IdentitiesOnly yes

Host crm-cp-sce
  HostName 10.255.0.3
  User root
  IdentityFile ~/.ssh/crm
  IdentitiesOnly yes

Host crm-agent-yib
  HostName 10.0.0.101
  User root
  IdentityFile ~/.ssh/crm
  IdentitiesOnly yes

Host crm-agent-hvq
  HostName 10.0.0.102
  User root
  IdentityFile ~/.ssh/crm
  IdentitiesOnly yes

Host crm-cp-* crm-agent-* crm-cp
  StrictHostKeyChecking accept-new
  UserKnownHostsFile ~/.ssh/known_hosts_crm

Host crm-db
  HostName 10.1.0.10
  User root
  IdentityFile ~/.ssh/crm
  IdentitiesOnly yes
  StrictHostKeyChecking accept-new
  UserKnownHostsFile ~/.ssh/known_hosts_crm
