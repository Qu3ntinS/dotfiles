# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Dock monitors (1080p) always scale 1 — must come before wildcard
monitor = DP-1, preferred, auto, 1
monitor = DP-2, preferred, auto, 1
monitor = DP-3, preferred, auto, 1
monitor = DP-4, preferred, auto, 1
monitor = DP-5, preferred, auto, 1
monitor = DP-6, preferred, auto, 1
monitor = DP-7, preferred, auto, 1
monitor = DP-8, preferred, auto, 1
monitor = DP-9, preferred, auto, 1
monitor = DP-10, preferred, auto, 1

# Laptop display undocked
env = GDK_SCALE,1
monitor=,preferred,auto,1.25

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# My Monitor setup DP-3 (Main), DP-2 (Left), DP-1 (Right)
#monitor = DP-2, 1920x1080@180, 0x-420, 1, transform, 1 #Linker Monitor Hochkannt
